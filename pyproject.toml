[project]
name = "helpdesk-agent"
version = "0.1.0"
description = "IT helpdesk agent: LangGraph + a custom MCP server over tickets, licenses and a knowledge base, with policy guardrails and human approval before every write"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "langgraph>=1.2",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",
    "pydantic>=2.7",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
helpdesk-agent = "helpdesk_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
